    /* Refined study studio theme */
    :root{--paper:#f3f3ed;--card:#fffefa;--ink:#233128;--muted:#7c887d;--line:#e2e7dd;--green:#356b4b;--green-dark:#28563a;--green-pale:#e8f2e9;--gold:#c69336;--shadow:0 14px 38px rgba(37,54,39,.065)}
    body{background:radial-gradient(ellipse at 88% 0%,#e5eee4 0,transparent 35%),var(--paper)}
    .app-shell{max-width:1500px}
    .sidebar{background:rgba(250,251,247,.9);border-color:#e3e8df}
    .brand-mark{background:linear-gradient(145deg,#4b805b,#2c5b3c);box-shadow:0 9px 18px #356b4b30}
    .nav button{border-radius:12px;padding:12px}
    .nav button.active{background:linear-gradient(100deg,#e3efe4,#edf4eb);box-shadow:inset 3px 0 #4e8057}
    .nav-icon{font-size:17px}
    .main{padding-top:30px}
    .topbar{margin-bottom:24px}
    .topbar .eyebrow{display:inline-flex;padding:8px 11px;background:#fffefa99;border:1px solid #e3e8df;border-radius:999px}
    .avatar{box-shadow:0 0 0 4px #ffffffb5}
    .hero{position:relative;isolation:isolate;overflow:hidden;align-items:center;min-height:174px;margin-bottom:19px;padding:26px 28px;border:1px solid #dce8db;border-radius:22px;background:linear-gradient(115deg,#edf4e9 0%,#f6f7f0 57%,#f0f3e7 100%);box-shadow:0 12px 30px #466b4510}
    .hero:after{content:'学';position:absolute;z-index:-1;right:165px;top:-35px;color:#5c805a0c;font:230px/1 'Noto Serif SC',serif;transform:rotate(-9deg);pointer-events:none}
    .hero h1{font-size:clamp(31px,3.3vw,43px);letter-spacing:-1.8px;margin:10px 0 8px;color:#263d2d}
    .hero p{font-size:14px;color:#718174}
    .hero .eyebrow{color:#66836a}
    .level-select{position:relative;z-index:1;padding:12px 15px;border-color:#dce5d9;background:#fffefa;color:#566458;box-shadow:0 5px 15px #304d3510}
    .stat-card,.panel{border-color:#e4e8df;border-radius:17px;box-shadow:var(--shadow)}
    .stat-card{padding:17px 20px;transition:transform .18s ease,box-shadow .18s ease}
    .stat-card:hover{transform:translateY(-2px);box-shadow:0 17px 34px #25362512}
    .stat-head{letter-spacing:1.15px}
    .stat-icon{width:25px;height:25px;display:grid;place-items:center;border-radius:9px;background:#edf4eb;color:#4f7b55}
    .stat-value{font-size:27px;color:#26372a}
    .dashboard{gap:18px}
    .panel-head{padding:19px 21px 15px}
    .panel-head h2,.list-title{font-size:15px}
    .panel-hint{padding:6px 8px;border-radius:999px;background:#f3f5ef;color:#879283;font-size:8px}
    .study-body{padding:0 20px 19px}
    .flashcard{min-height:290px;border-color:#dce8dc;border-radius:16px;background:radial-gradient(circle at 50% 35%,#fbfdf7 0,#f0f5ed 64%,#eaf1e8 100%);box-shadow:inset 0 1px #ffffffa8}
    .flashcard:hover{box-shadow:0 9px 24px #47664b12,inset 0 1px #fff}
    .flashcard:before{width:260px;height:260px;left:-156px;top:-160px;border-color:#cbdcc9}
    .flashcard:after{width:220px;height:220px;right:-128px;bottom:-158px;border-color:#cbdcc9}
    .card-tag{padding:7px 9px;border-radius:999px;background:#ffffff9c;color:#68806a;font-size:8px}
    .card-star{width:37px;height:37px;display:grid;place-items:center;border-radius:12px;background:#ffffffa8;color:#9ca797;font-size:21px}
    .card-star:hover{background:white;color:var(--gold)}
    .hanzi{font-size:82px;color:#284632;text-shadow:0 2px 0 #ffffffa8}
    .pinyin{color:#6d806f;font-size:16px}
    .meaning{color:#2d4e35;font-size:17px}
    .reveal-note{padding:7px 10px;border-radius:999px;background:#ffffff8c;color:#839181;font-size:8px}
    .btn{border-radius:10px;padding:10px 13px;font-size:11px}
    .btn-primary{background:linear-gradient(135deg,#477b52,#326342);box-shadow:0 6px 13px #356b4b22}
    .btn-primary:hover{background:linear-gradient(135deg,#3c7049,#28563a);box-shadow:0 8px 16px #356b4b30}
    .session-body{padding:0 20px 19px}
    .session-count{font-size:32px;color:#2b3f30}
    .goal-dots i{height:6px}
    .tip-icon{width:28px;height:28px;display:grid;place-items:center;border-radius:10px;background:#f8f0df}
    .vocabulary-panel{margin-top:18px}
    .vocab-head{padding:20px 21px 16px;background:linear-gradient(110deg,#fffefa,#fbfcf8)}
    .search,.filter-select,.filter-btn,.import-label{border-radius:9px}
    .filter-btn.active{box-shadow:inset 0 0 0 1px #d4e2d4}
    .word-row{padding-top:12px;padding-bottom:12px}
    .word-row:not(.header):hover{background:#f7f9f4}
    .word-zh{color:#31533a}
    .credits{color:#92998e}
    button:focus-visible,input:focus-visible,select:focus-visible,.flashcard:focus-visible{outline:3px solid #91b492;outline-offset:3px}
    @media(max-width:650px){.hero{min-height:150px;padding:20px 17px;border-radius:17px}.hero:after{right:72px;top:-20px;font-size:185px}.hero h1{font-size:30px}.hero p{font-size:12px}.level-select{gap:4px;padding:9px 10px}.stat-card{padding:12px 10px}.stat-icon{width:21px;height:21px}.flashcard{min-height:250px}.hanzi{font-size:72px}.vocab-head{padding:17px 15px}.panel-head{padding:16px 16px 13px}}
  </style>

    window.addEventListener('error', function (event) {

      root.innerHTML = '<main style="max-width:720px;margin:12vh auto;padding:24px;font:16px Arial,sans-serif;color:#252b25"><h1>The vocabulary app could not start</h1><p>Refresh the page. If it still fails, share this error:</p><pre style="white-space:pre-wrap;background:#f1f2ed;padding:16px;border-radius:8px"></pre></main>';
      root.querySelector('pre').textContent = event.message || 'Unknown JavaScript error';
    });
  </script>
